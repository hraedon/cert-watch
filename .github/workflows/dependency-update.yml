name: dependency-update

on:
  schedule:
    # 1st of each month at 07:00 UTC
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv venv

      - name: Refresh lockfile
        run: uv lock

      - name: Install deps from refreshed lock
        run: uv sync --frozen --extra dev --extra auth

      - name: pip-audit
        id: audit
        continue-on-error: true
        run: |
          uv pip freeze | grep -v 'cert-watch' > /tmp/audit-reqs.txt
          uv pip install pip-audit
          .venv/bin/pip-audit --strict --requirement /tmp/audit-reqs.txt

      - name: Create PR for lockfile update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "deps: monthly uv lock refresh"
          title: "deps: monthly uv lock refresh"
          body: |
            Automated monthly dependency lockfile refresh.

            pip-audit result: ${{ steps.audit.outcome == 'success' && '✅ No vulnerabilities found' || '⚠️ Review pip-audit output in workflow logs' }}
          branch: deps/monthly-lock
          delete-branch: true
          labels: dependencies
          add-paths: |
            uv.lock
