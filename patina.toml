# cert-watch's adoption declaration for patina (see patina docs/adoption.md).
#
# CONSUMER-OWNED: patina's sync.sh never writes or rewrites this file. patina
# defines what conformance means; this file records what cert-watch claims.
# Checked by tests/test_patina_conformance.py.

[patina]
version = "0.5.0"
accent  = "cert-watch"
prefix  = "cw"
static  = "src/cert_watch/static"

# Recorded local deviation (#126 S2, owner-approved 2026-09-25): cert-watch
# does not use --accent. patina's token contract assigns the accent to links,
# focus rings, the wordmark and active nav; cert-watch renders all of those as
# neutral ink (links carry a hairline underline), because the bronze accent sat
# beside amber --warn and read as a status. Colour in cert-watch means status
# only. The contract tokens are untouched (no redefinition); cw.css simply
# never references --accent. Candidate for upstream discussion in patina.

[conformance.vendor]
state = "enforced"

[conformance.contract]
state = "enforced"

# Reviewed, not clean. UI-INVENTORY.md enumerates every concept, its one
# editing control and its write endpoints, and names five open violations
# (V1-V5). V1 was adjudicated by the owner on 2026-08-14 -- merge the two notes
# fields to one host-scoped field -- and V1/V2 are implemented. The
# facet is `reviewed` because a human has been through it and the gaps are
# recorded, not because the model is currently free of duplicates.
[conformance.content_model]
state = "reviewed"
reviewed_through = "c009509f562e71e8e48232337ce24772921884a8"
note = "UI-INVENTORY.md; V1/V2 implemented (host notes; unmatched legacy notes retained); inactive group-webhook control removed for V3; V4/V5 open"

# The domain surfaces are derived from operator questions and record their
# archetype, decision-complete content, concept ownership, and exclusions.
[conformance.structure]
state = "attested"
evidence = "docs/surfaces/: Home, Browse, Certificate detail, Posture, Activity, and Settings surface briefs"
