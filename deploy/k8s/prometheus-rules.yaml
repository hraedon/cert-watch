apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-watch-alerts
  namespace: cert-watch
  labels:
    app.kubernetes.io/name: cert-watch
    app.kubernetes.io/part-of: cert-watch
    prometheus: kube-prometheus
spec:
  groups:
    - name: cert-watch.rules
      rules:
        - alert: CertExpiringCritical
          expr: cert_watch_cert_expiry_days < 3
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Certificate expiring in < 3 days"
            description: >-
              Certificate {{ $labels.subject }} on host {{ $labels.host }}
              expires in {{ $value }} days. Renew immediately.

        - alert: CertExpiringWarning
          expr: cert_watch_cert_expiry_days < 7
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Certificate expiring in < 7 days"
            description: >-
              Certificate {{ $labels.subject }} on host {{ $labels.host }}
              expires in {{ $value }} days. Plan renewal soon.

        - alert: CertExpired
          # Negated so $value is *positive* days-since-expiry — the raw
          # metric is negative for expired certs, and "expired -16 days ago"
          # is nonsense in a pager. (cert_watch_cert_expiry_days < 0)
          expr: 0 - cert_watch_cert_expiry_days > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Certificate has expired"
            description: >-
              Certificate {{ $labels.subject }} on host {{ $labels.host }}
              expired {{ $value }} days ago. Renew immediately.

        - alert: CertWatchExpiredCertificates
          expr: cert_watch_certificates_expired > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Expired certificates detected"
            description: >-
              {{ $value }} certificate(s) have expired. Check the cert-watch
              dashboard for details.

        - alert: CertWatchScanStalled
          # No successful scan recorded in > 36h against a daily 06:00
          # schedule (1.5x interval): the app is alive but the scheduler
          # has silently stopped — or (with external scraping) the whole
          # app was down and the series resumes stale. WI-140: this exact
          # failure mode ran undetected for 12 days on an IIS-hosted
          # instance.
          expr: time() - cert_watch_last_scan_timestamp_seconds > 129600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "cert-watch scans have stalled"
            description: >-
              No scan has been recorded in over 36 hours (last scan was
              {{ $value | humanizeDuration }} ago). Check that the scheduler
              is running and the hosting environment keeps the process
              alive (IIS: application preload; systemd/k8s: service health).
